[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sd-forge-anima-layer-lab"
version = "0.2.0"
description = "Anima Layer Lab extension for SD Forge"
requires-python = ">=3.13"
dependencies = [
    "safetensors>=0.5",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
